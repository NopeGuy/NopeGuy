<svg fill="none" viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                }

                body {
                margin: 0;
                padding: 20px;
                background: #008080;
                font-family: "MS Sans Serif", "Microsoft Sans Serif", sans-serif;
                font-size: 11px;
                }

                .window {
                width: 100%;
                max-width: 760px;
                margin: 0 auto;
                background: #c0c0c0;
                box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
                }

                .title-bar {
                background: linear-gradient(to right, #000080, #1084d0);
                padding: 3px 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                }

                .title-bar-text {
                color: white;
                font-weight: bold;
                font-size: 11px;
                }

                .title-bar-controls {
                display: flex;
                gap: 2px;
                }

                .title-bar-controls button {
                width: 16px;
                height: 14px;
                padding: 0;
                font-size: 8px;
                background: #c0c0c0;
                border: 1px solid;
                border-color: white #000 #000 white;
                }

                .window-body {
                background: #c0c0c0;
                border: 2px solid;
                border-color: white #808080 #808080 white;
                padding: 30px;
                min-height: 200px;
                }

                h1 {
                font-size: 16px;
                margin: 0 0 15px 0;
                font-weight: bold;
                }

                .tree-view {
                list-style: none;
                padding-left: 20px;
                margin: 10px 0;
                border: 2px solid;
                border-color: #808080 white white #808080;
                background: white;
                padding: 10px;
                }

                .tree-view li {
                padding: 2px 0;
                }

                .tree-view li:before {
                content: "▪ ";
                margin-right: 5px;
                }

                .status-bar {
                background: #c0c0c0;
                border-top: 1px solid white;
                padding: 3px 5px;
                display: flex;
                gap: 5px;
                }

                .status-bar-field {
                border: 1px solid;
                border-color: #808080 white white #808080;
                padding: 2px 5px;
                font-size: 11px;
                flex: 1;
                }

                a {
                color: #0000ee;
                text-decoration: underline;
                }

                .message-box {
                border: 2px solid;
                border-color: white #000 #000 white;
                background: #c0c0c0;
                padding: 20px;
                margin: 20px 0;
                text-align: center;
                }

                .message-box p {
                font-size: 13px;
                margin: 10px 0;
                line-height: 1.5;
                }

                .cursor-pointer {
                cursor: pointer;
                animation: blink 1.5s infinite;
                }

                @keyframes blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0.3; }
                }
            </style>

            <div class="window">
                <div class="title-bar">
                    <div class="title-bar-text">NopeGuy's Profile - README.txt</div>
                    <div class="title-bar-controls">
                        <button>_</button>
                        <button>□</button>
                        <button>×</button>
                    </div>
                </div>

                <div class="window-body">
                    <h1>Welcome to my digital corner of the universe</h1>
                    
                    <br /> Hi, I'm <a
                        href="https://iamawesome.com/">Luis (a.k.a. NopeGuy)</a>
                    <ul
                        class="tree-view">
                        <li>Informatics Engineer</li>
                        <li>Interests: Homebrew Software, Game Development, ROM Hacking</li>
                    </ul>
                    
                    <div
                        class="message-box cursor-pointer">
                        <p>
                            <strong>🖱️ Click anywhere on this window for the full version!
                    🖱️</strong>
                        </p>
                        <p>See my projects or connect with me.</p>
                    </div>
                </div>

                <div class="status-bar">
                    <div class="status-bar-field">© 20XX NopeGuy</div>
                    <div class="status-bar-field">Powered by nostalgia</div>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>