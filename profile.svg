                    border: 2px solid;
                    border-color: #dfdfdf #808080 #808080 #dfdfdf;
                    padding: 3px 10px;
                    font-family: "MS Sans Serif", sans-serif;
                    font-size: 11px;
                    cursor: pointer;
                }
                
                button:active {
                    border-color: #808080 #dfdfdf #dfdfdf #808080;
                }
                
                .status-bar {
                    background: #c0c0c0;
                    border-top: 2px solid #dfdfdf;
                    padding: 3px;
                    display: flex;
                    gap: 5px;
                }
                
                .status-bar-field {
                    border: 1px solid;
                    border-color: #808080 #dfdfdf #dfdfdf #808080;
